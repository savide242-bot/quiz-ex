<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plano Reconquista Absoluta</title>
  <link rel="icon" type="image/jpeg" href="assets/images/dr_carlos.jpg">
  <meta name="description" content="Use os gatilhos da atração e reconquiste sua ex rapidamente. Faça o teste grátis de 1 minuto.">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Plano Reconquista Absoluta">
  <meta property="og:description" content="Use os gatilhos da atração e reconquiste sua ex rapidamente.">
  <meta property="og:image" content="assets/images/dr_carlos.jpg">

  <!-- Estilos WhatsApp -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Audio de Notificação do WhatsApp -->
  <audio id="wa-notification-audio" src="assets/audio/audio_whatsapp.mp3" preload="auto"></audio>

  <!-- Container Geral da Aplicação -->
  <div class="app-container">
    
    <!-- Cabeçalho WhatsApp -->
    <header class="wa-header">
      <div class="wa-header-left">
        <div class="wa-back-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </div>
        <div class="wa-avatar-wrapper">
          <img src="assets/images/dr_carlos.jpg" alt="Dr. Carlos">
        </div>
        <div class="wa-contact-info">
          <div class="wa-contact-name-row">
            <span class="wa-contact-name">Dr. Carlos M. Nhantumbo</span>
            <span class="wa-verified-badge" title="Conta Verificada">
              <svg viewBox="0 0 18 18" height="17" width="17">
                <polygon fill="#00a884" points="9,16 7.1,16.9 5.8,15.2 3.7,15.1 3.4,13 1.5,12 2.2,9.9 1.1,8.2 2.6,6.7 2.4,4.6 4.5,4 5.3,2 7.4,2.4 9,1.1 10.7,2.4 12.7,2 13.6,4 15.6,4.6 15.5,6.7 17,8.2 15.9,9.9 16.5,12 14.7,13 14.3,15.1 12.2,15.2 10.9,16.9"></polygon>
                <polygon fill="#FFFFFF" points="13.1,7.3 12.2,6.5 8.1,10.6 5.9,8.5 5,9.4 8,12.4"></polygon>
              </svg>
            </span>
          </div>
          <span class="wa-status" id="wa-contact-status">Psicólogo & Especialista em Relacionamentos</span>
        </div>
      </div>

      <div class="wa-header-right">
        <!-- Ícone Chamada de Vídeo -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
        </svg>
        <!-- Ícone Chamada de Voz -->
        <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.44-5.15-3.75-6.59-6.59l1.97-1.57c.26-.26.35-.65.24-1.01A11.36 11.36 0 018.56 4.3c0-.55-.45-1-1-1H4.03c-.55 0-1 .45-1 1C3.03 13.67 10.33 21 19.33 21c.55 0 1-.45 1-1v-3.62c0-.55-.45-1-1-1z"/>
        </svg>
        <!-- Ícone Menu Três Pontos -->
        <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </div>
    </header>

    <!-- Área de Conversa com Rolagem -->
    <main class="chat-scroll-area" id="chat-scroll-area">
      <!-- Aviso de Criptografia do WhatsApp -->
      <div class="encryption-notice">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        <span>As mensagens e chamadas são protegidas com a criptografia de ponta a ponta e ficam somente entre você e o Dr. Carlos.</span>
      </div>

      <!-- Divisor Hoje -->
      <div class="date-divider">HOJE</div>

      <!-- As mensagens serão inseridas dinamicamente aqui -->
    </main>

    <!-- Painel Fixo Inferior com as Opções de Resposta -->
    <footer class="options-panel" id="options-panel">
      <!-- Botões de escolha do usuário renderizados aqui -->
    </footer>

  </div>

  <!-- Modal Lightbox para Ampliar Depoimentos -->
  <div class="lightbox-modal" id="lightbox-modal">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img src="" alt="Depoimento Ampliado" class="lightbox-img" id="lightbox-img">
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="quiz-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
